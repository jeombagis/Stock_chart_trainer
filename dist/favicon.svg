<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sct-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sct-trend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sct-candle-up" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sct-candle-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="sct-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#sct-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

  <!-- Candlestick 1 (Left) -->
  <line x1="18" y1="28" x2="18" y2="46" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <rect x="15" y="32" width="6" height="10" rx="1.5" fill="#475569"/>

  <!-- Candlestick 2 (Center) -->
  <line x1="32" y1="22" x2="32" y2="44" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="26" width="6" height="12" rx="1.5" fill="url(#sct-candle-mid)"/>

  <!-- Candlestick 3 (Right) -->
  <line x1="46" y1="12" x2="46" y2="38" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <rect x="43" y="16" width="6" height="15" rx="1.5" fill="url(#sct-candle-up)"/>

  <!-- Upward Trend Dynamic Glow Line -->
  <path d="M12 45 C 22 42, 28 32, 42 22 L 52 14" stroke="url(#sct-trend)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#sct-glow)"/>
  
  <!-- Arrow Head / Target Spark -->
  <circle cx="52" cy="14" r="3.5" fill="#34d399" filter="url(#sct-glow)"/>
  <circle cx="52" cy="14" r="1.5" fill="#ffffff"/>
</svg>